<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>pi-htmldoc preview</title>
<style>
  html,body{margin:0;width:1200px;height:675px;overflow:hidden}
  :root{--bg:#121820;--grid:rgba(255,255,255,.035);--text:#e3e9ef;--muted:#8e9aa7;--dim:#6f7b88;--accent:#48d47c;--term:#0b1016;--line:#2a3340;--pill-bg:rgba(72,212,124,.08);--pill-line:#2f6b45}
  body.light{--bg:#f3eee4;--grid:rgba(60,40,10,.05);--text:#1d2228;--muted:#5c6570;--dim:#7c858f;--accent:#1f9d55;--term:#1b2129;--line:#d8cfbf;--pill-bg:rgba(31,157,85,.08);--pill-line:#9fd4b4}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;position:relative;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
  .wrap{position:absolute;inset:0;padding:52px 68px 56px;box-sizing:border-box;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:ui-monospace,Menlo,monospace;font-size:30px;color:var(--muted)}
  .brand b{color:var(--accent);font-weight:700}.brand span{color:var(--text);font-weight:700}
  .pill{font-family:ui-monospace,Menlo,monospace;font-size:24px;color:var(--accent);border:2px solid var(--pill-line);background:var(--pill-bg);border-radius:999px;padding:8px 22px;font-weight:600}
  h1{font-size:104px;line-height:1;margin:34px 0 0;letter-spacing:-.03em;font-weight:800}
  h1 .accent{color:var(--accent)}
  .term{margin-top:auto;background:var(--term);border:2px solid var(--line);border-radius:16px;padding:26px 32px;font-family:ui-monospace,Menlo,monospace;font-size:31px;line-height:1.5;color:#d3dbe3}
  .term .you{color:#8e9aa7}.term .you b{color:#e3e9ef;font-weight:600}
  .term .ok{color:#48d47c;font-weight:700}
  .term .url{color:#7cc4ff;text-decoration:underline;text-underline-offset:5px}
  .page{position:absolute;right:68px;top:142px;width:430px;height:262px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;border:2px solid var(--line)}
  .bar{height:38px;background:#e9edf1;display:flex;align-items:center;gap:8px;padding:0 14px}
  .dot{width:12px;height:12px;border-radius:50%;background:#c5ccd3}
  .addr{margin-left:10px;flex:1;height:22px;border-radius:6px;background:#fff;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#5c6570;display:flex;align-items:center;padding:0 10px}
  .doc{padding:18px 22px;color:#1d2228}
  .doc h2{margin:0 0 14px;font-size:24px;letter-spacing:-.01em}
  .chart{display:flex;align-items:flex-end;gap:14px;height:100px;border-bottom:2px solid #e3e7eb;padding-bottom:4px}
  .chart i{flex:1;border-radius:5px 5px 0 0;background:#48d47c}
  .chart i:nth-child(2n){background:#7cc4ff}
  .rows{margin-top:14px}.rows div{height:10px;border-radius:5px;background:#e3e7eb;margin-top:9px}
</style></head>
<!-- Rendered to preview.png at 1200x675 with headless Chrome; class "light" gives a cream variant. -->
<body class="dark"><div class="wrap">
  <div class="top">
    <div class="brand"><b>&gt;_</b> <span>htmldoc</span> for Pi</div>
    <div class="pill">free</div>
  </div>
  <h1>Share what<br><span class="accent">Pi writes.</span></h1>
  <div class="page">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="addr">p.htmldoc.space/NO8JWj8cd57m</span></div>
    <div class="doc"><h2>Q3 status report</h2>
      <div class="chart"><i style="height:45%"></i><i style="height:70%"></i><i style="height:58%"></i><i style="height:92%"></i><i style="height:76%"></i></div>
      <div class="rows"><div style="width:92%"></div><div style="width:70%"></div></div>
    </div>
  </div>
  <div class="term">
    <div class="you">&gt; <b>share the report</b></div>
    <div><span class="ok">✓ Shared</span> <span class="url">p.htmldoc.space/NO8JWj8cd57m</span></div>
  </div>
</div></body></html>
